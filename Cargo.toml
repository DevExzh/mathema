[package]
name = "mathema"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Convert math formulas between LaTeX, MathML, OMML, MTEF, and UnicodeMath via a shared AST"
license = "MIT"
repository = "https://github.com/DevExzh/mathema"
homepage = "https://github.com/DevExzh/mathema"
readme = "README.md"
keywords = ["latex", "mathml", "omml", "math", "tex"]
categories = ["mathematics", "parsing", "text-processing"]
# Keep the published tarball lean: drop multi-megabyte format specs, internal
# planning docs, the demo web/WASM apps, debug/audit examples, and test fixtures.
# None of these are needed to build or use the library.
exclude = [
    "docs/specs/",
    "docs/superpowers/",
    "docs/reports/",
    "docs/PACKAGE_SUPPORT_PLAN.md",
    "web/",
    "wasm/bench/",
    "wasm/example/",
    "examples/",
    "benches/",
    "fuzz/",
    "tests/data/",
    "tests/fixtures/",
    "testsuite.zip",
    ".github/",
    "CLAUDE.md",
]

[dependencies]
# Core (always compiled)
smallvec = "1"
nom = "7"
quick-xml = "0.37"
thiserror = "2"
phf = { version = "0.11", features = ["macros"] }

# CLI (native binary only)
clap = { version = "4", features = ["derive"], optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
indicatif = { version = "0.17", optional = true }

# Serialization
serde = { version = "1", features = ["derive"], optional = true }

# WASM
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

# Rendering
fontdue = { version = "0.9", optional = true }
tiny-skia = { version = "0.11", optional = true }
jpeg-encoder = { version = "0.6", optional = true }
ttf-parser = { version = "0.25", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"
clap_mangen = "0.2"
tempfile = "3"
serde_json = "1"
resvg = "0.45"
png = "0.17"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:miette", "dep:indicatif"]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:wasm-bindgen-futures", "dep:js-sys", "serde"]
render = ["dep:ttf-parser"]
raster = ["render", "dep:fontdue", "dep:tiny-skia", "dep:jpeg-encoder"]
font-embed = ["render"]

# Release profile tuning: cross-crate inlining + single codegen unit trade a
# little compile time for faster parse/layout/emit in the produced binary.
[profile.release]
lto = "thin"
codegen-units = 1

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mathema"
path = "src/main.rs"
required-features = ["cli"]

