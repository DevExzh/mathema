[package]
name = "mathema"
version = "0.1.0"
edition = "2024"
description = "Convert math formulas between LaTeX, MathML, OMML, MTEF, and UnicodeMath via a shared AST"
license = "MIT"

[dependencies]
nom = "7"
quick-xml = "0.37"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
serde = ["dep:serde"]
wasm = ["wasm-bindgen"]

[[bench]]
name = "benchmark"
harness = false
