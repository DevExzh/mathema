[package]
name = "mathema"
version = "0.1.0"
edition = "2024"
description = "Convert math formulas between LaTeX, MathML, OMML, MTEF, and UnicodeMath via a shared AST"
license = "MIT"

[dependencies]
smallvec = "1"
nom = "7"
quick-xml = "0.37"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
fontdue = { version = "0.9", optional = true }
tiny-skia = { version = "0.11", optional = true }
jpeg-encoder = { version = "0.6", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
serde = ["dep:serde"]
wasm = ["wasm-bindgen"]
render = []
raster = ["render", "dep:fontdue", "dep:tiny-skia", "dep:jpeg-encoder"]

[[bench]]
name = "benchmark"
harness = false
