[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Lint gates. CI runs `cargo clippy --all-features -- -D warnings`, which
# promotes every `warn` below to a hard error. Kept at `warn` here so local
# development and older toolchains are not blocked by a single new lint.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
manual_checked_ops = "warn"


[[example]]
name = "render_rate"
required-features = ["render"]
