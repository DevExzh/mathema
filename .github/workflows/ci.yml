name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  web:
    name: web (check and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.1 --locked
      - name: Build WASM bindings
        working-directory: ./web
        run: bun run wasm
      - name: Check generated WASM declarations
        run: node wasm/check-generated-types.mjs web/src/lib/wasm/mathema.d.ts
      - name: Verify portable and SIMD128 WASM packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y wabt
          wasm-validate --disable-simd web/src/lib/wasm/mathema_bg.wasm
          wasm-validate web/src/lib/wasm-simd/mathema_bg.wasm
          if wasm-validate --disable-simd web/src/lib/wasm-simd/mathema_bg.wasm 2>/dev/null; then
            echo "::error::The SIMD package contains no SIMD instructions"
            exit 1
          fi
          node wasm/smoke.mjs web/src/lib/wasm web/src/lib/wasm-simd
      - name: Install JS dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org
      - name: Check Svelte and TypeScript
        working-directory: ./web
        run: bun run check
      - name: Build static site
        working-directory: ./web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features

  no-default-features:
    name: build (library-only, no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (no default features)
        run: cargo build --no-default-features
      - name: Test (no default features)
        run: cargo test --no-default-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --no-deps --all-features

  wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build wasm bindings
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm

  neon:
    name: NEON writers (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: thumbv7neon-unknown-linux-gnueabihf
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_THUMBV7NEON_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_THUMBV7NEON_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -cpu cortex-a9 -L /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install the ARMv7 linker and emulator
        if: matrix.target == 'thumbv7neon-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Run hex and XML parity tests on Arm
        run: |
          cargo test --locked --target "$TARGET" --no-default-features --features render --lib writer::mtef::tests::hex
          cargo test --locked --target "$TARGET" --no-default-features --features render --lib writer::xml_chars::tests

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit dependencies for security advisories
        run: cargo audit

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --all-features

  miri:
    name: miri (unsafe checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: miri test (AST arena unsafe accessors + string interner)
        run: cargo miri test --lib ast

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run each fuzz target briefly
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $target"
            mkdir -p "fuzz/corpus/$target"
            case "$target" in
              fuzz_latex* | fuzz_layout | fuzz_svg_embed | fuzz_render_paths | fuzz_controlled_convert)
                cargo +nightly fuzz run "$target" "fuzz/corpus/$target" fuzz/seeds/latex -- \
                  -dict=fuzz/dict/latex.dict -max_total_time=30 -runs=100000 ;;
              fuzz_mathml | fuzz_omml | fuzz_omml_roundtrip)
                format="${target#fuzz_}"
                cargo +nightly fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/${format%_roundtrip}" -- \
                  -max_total_time=30 -runs=100000 ;;
              *)
                cargo +nightly fuzz run "$target" -- -max_total_time=30 -runs=100000 ;;
            esac
            echo "::endgroup::"
          done

  compatibility:
    name: external compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install external validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxml2-utils texlive-latex-recommended unzip
      - name: Download MathML 3 schema
        env:
          MATHML_XSD_URL: https://www.w3.org/Math/XMLSchema/mathml3-xsd.zip
          MATHML_XSD_SHA256: 921cba0eaf1ec3c2756849425d0ca4c7b2d5f549eda7dd1e0d7f1351ba173a8d
        run: |
          curl --fail --location --retry 3 "$MATHML_XSD_URL" \
            --output "$RUNNER_TEMP/mathml3-xsd.zip"
          printf '%s  %s\n' "$MATHML_XSD_SHA256" \
            "$RUNNER_TEMP/mathml3-xsd.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/mathml3-xsd.zip" -d "$RUNNER_TEMP/mathml3"
      - name: Download ECMA-376 Transitional schemas
        env:
          ECMA_XSD_URL: https://ecma-international.org/wp-content/uploads/ECMA-376-4_5th_edition_december_2016.zip
          ECMA_XSD_SHA256: bd25da1109f73762356596918bf5ff8b74a1331642dba5f1c1d1dfc6bed34ecd
          ECMA_INNER_SHA256: d34187520749998af306faf1b730e568b0ca6d88ad24638a407c0a9bb4ca04fc
        run: |
          curl --fail --location --retry 3 "$ECMA_XSD_URL" \
            --output "$RUNNER_TEMP/ecma376-part4.zip"
          printf '%s  %s\n' "$ECMA_XSD_SHA256" \
            "$RUNNER_TEMP/ecma376-part4.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ecma376-part4.zip" -d "$RUNNER_TEMP/ecma376"
          unzip -p "$RUNNER_TEMP/ecma376-part4.zip" \
            OfficeOpenXML-XMLSchema-Transitional.zip \
            >"$RUNNER_TEMP/ecma-transitional.zip"
          printf '%s  %s\n' "$ECMA_INNER_SHA256" \
            "$RUNNER_TEMP/ecma-transitional.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ecma-transitional.zip" \
            -d "$RUNNER_TEMP/ecma-transitional"
      - name: Download W3C XML namespace schema
        env:
          XML_XSD_URL: https://www.w3.org/2001/xml.xsd
          XML_XSD_SHA256: 61960fb3131e38022caad5360e2f33a3382578ab3c80cd58bd74320ede61b20c
        run: |
          curl --fail --location --retry 3 "$XML_XSD_URL" \
            --output "$RUNNER_TEMP/xml.xsd"
          printf '%s  %s\n' "$XML_XSD_SHA256" \
            "$RUNNER_TEMP/xml.xsd" | sha256sum --check
      - name: Run external compatibility subset
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mathema-target
          MATHEMA_MATHML_XSD: ${{ runner.temp }}/mathml3/mathml3/mathml3.xsd
          MATHEMA_OMML_XSD: ${{ runner.temp }}/ecma-transitional/shared-math.xsd
          MATHEMA_XML_XSD: ${{ runner.temp }}/xml.xsd
        run: scripts/external_compat.sh

  feature-matrix:
    name: feature combination (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            args: --no-default-features
          - name: render
            args: --no-default-features --features render
          - name: raster-serde
            args: --no-default-features --features raster,serde
          - name: cli-serde
            args: --features cli,serde
          - name: font-embed
            args: --no-default-features --features font-embed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check feature combination
        run: cargo check --locked --all-targets ${{ matrix.args }}
      - name: Test library feature combination
        run: cargo test --locked --lib ${{ matrix.args }}

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify packaged notices and embedded fonts
        run: scripts/verify_package.sh

  performance:
    name: performance sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Sample conversion routes, readers and layout
        run: |
          cargo bench --locked --features render --bench benchmark -- 'convert_result_routes|reader_shapes' \
            --noplot --warm-up-time 1 --measurement-time 2 --sample-size 20 --save-baseline ci
          cargo bench --locked --features render --bench layout -- layout_depth_and_shape \
            --noplot --warm-up-time 1 --measurement-time 2 --sample-size 20 --save-baseline ci
          rustc -vV > target/criterion/toolchain.txt
          lscpu > target/criterion/cpu.txt
      - name: Upload Criterion trend artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
