name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  web:
    name: web (check and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM bindings
        working-directory: ./web
        run: bun run wasm
      - name: Check generated WASM declarations
        run: node wasm/check-generated-types.mjs web/src/lib/wasm/mathema.d.ts
      - name: Smoke test WASM bindings
        run: node wasm/smoke.mjs web/src/lib/wasm
      - name: Install JS dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org
      - name: Check Svelte and TypeScript
        working-directory: ./web
        run: bun run check
      - name: Build static site
        working-directory: ./web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features

  no-default-features:
    name: build (library-only, no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (no default features)
        run: cargo build --no-default-features
      - name: Test (no default features)
        run: cargo test --no-default-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm bindings
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for security advisories
        run: cargo audit

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  miri:
    name: miri (unsafe checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri test (AST arena unsafe accessors + string interner)
        run: cargo miri test --lib ast

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each fuzz target briefly
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzz $target"
            mkdir -p "fuzz/corpus/$target"
            case "$target" in
              fuzz_latex* | fuzz_layout | fuzz_svg_embed)
                cargo +nightly fuzz run "$target" "fuzz/corpus/$target" fuzz/seeds/latex -- \
                  -dict=fuzz/dict/latex.dict -max_total_time=30 -runs=100000 ;;
              fuzz_mathml | fuzz_omml | fuzz_omml_roundtrip)
                format="${target#fuzz_}"
                cargo +nightly fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/${format%_roundtrip}" -- \
                  -max_total_time=30 -runs=100000 ;;
              *)
                cargo +nightly fuzz run "$target" -- -max_total_time=30 -runs=100000 ;;
            esac
            echo "::endgroup::"
          done

  compatibility:
    name: external compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install external validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxml2-utils texlive-latex-recommended unzip
      - name: Download MathML 3 schema
        env:
          MATHML_XSD_URL: https://www.w3.org/Math/XMLSchema/mathml3-xsd.zip
          MATHML_XSD_SHA256: 921cba0eaf1ec3c2756849425d0ca4c7b2d5f549eda7dd1e0d7f1351ba173a8d
        run: |
          curl --fail --location --retry 3 "$MATHML_XSD_URL" \
            --output "$RUNNER_TEMP/mathml3-xsd.zip"
          printf '%s  %s\n' "$MATHML_XSD_SHA256" \
            "$RUNNER_TEMP/mathml3-xsd.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/mathml3-xsd.zip" -d "$RUNNER_TEMP/mathml3"
      - name: Download ECMA-376 Transitional schemas
        env:
          ECMA_XSD_URL: https://ecma-international.org/wp-content/uploads/ECMA-376-4_5th_edition_december_2016.zip
          ECMA_XSD_SHA256: bd25da1109f73762356596918bf5ff8b74a1331642dba5f1c1d1dfc6bed34ecd
          ECMA_INNER_SHA256: d34187520749998af306faf1b730e568b0ca6d88ad24638a407c0a9bb4ca04fc
        run: |
          curl --fail --location --retry 3 "$ECMA_XSD_URL" \
            --output "$RUNNER_TEMP/ecma376-part4.zip"
          printf '%s  %s\n' "$ECMA_XSD_SHA256" \
            "$RUNNER_TEMP/ecma376-part4.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ecma376-part4.zip" -d "$RUNNER_TEMP/ecma376"
          unzip -p "$RUNNER_TEMP/ecma376-part4.zip" \
            OfficeOpenXML-XMLSchema-Transitional.zip \
            >"$RUNNER_TEMP/ecma-transitional.zip"
          printf '%s  %s\n' "$ECMA_INNER_SHA256" \
            "$RUNNER_TEMP/ecma-transitional.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ecma-transitional.zip" \
            -d "$RUNNER_TEMP/ecma-transitional"
      - name: Download W3C XML namespace schema
        env:
          XML_XSD_URL: https://www.w3.org/2001/xml.xsd
          XML_XSD_SHA256: 61960fb3131e38022caad5360e2f33a3382578ab3c80cd58bd74320ede61b20c
        run: |
          curl --fail --location --retry 3 "$XML_XSD_URL" \
            --output "$RUNNER_TEMP/xml.xsd"
          printf '%s  %s\n' "$XML_XSD_SHA256" \
            "$RUNNER_TEMP/xml.xsd" | sha256sum --check
      - name: Run external compatibility subset
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mathema-target
          MATHEMA_MATHML_XSD: ${{ runner.temp }}/mathml3/mathml3/mathml3.xsd
          MATHEMA_OMML_XSD: ${{ runner.temp }}/ecma-transitional/shared-math.xsd
          MATHEMA_XML_XSD: ${{ runner.temp }}/xml.xsd
        run: scripts/external_compat.sh
