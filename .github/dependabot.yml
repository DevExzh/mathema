version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # SvelteKit and svelte-check currently require the TypeScript 6 compiler API.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      bun-dependencies:
        patterns:
          - "*"
