[package]
name = "mathema-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mathema]
path = ".."
features = ["render", "font-embed"]

[[bin]]
name = "fuzz_latex"
path = "fuzz_targets/fuzz_latex.rs"
doc = false

[[bin]]
name = "fuzz_mathml"
path = "fuzz_targets/fuzz_mathml.rs"
doc = false

[[bin]]
name = "fuzz_omml"
path = "fuzz_targets/fuzz_omml.rs"
doc = false

[[bin]]
name = "fuzz_mtef"
path = "fuzz_targets/fuzz_mtef.rs"
doc = false

[[bin]]
name = "fuzz_unicode_math"
path = "fuzz_targets/fuzz_unicode_math.rs"
doc = false

[[bin]]
name = "fuzz_latex_roundtrip"
path = "fuzz_targets/fuzz_latex_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_layout"
path = "fuzz_targets/fuzz_layout.rs"
doc = false

[[bin]]
name = "fuzz_svg_embed"
path = "fuzz_targets/fuzz_svg_embed.rs"
doc = false

[workspace]
